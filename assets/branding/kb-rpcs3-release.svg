  <text x="143" y="576" font-family="Arial, Helvetica, sans-serif" font-size="26"
        letter-spacing="1" fill="#6E93A3">Unofficial PS5 port of the RPCS3 PlayStation 3 emulator</text>

  <g fill="none" stroke="url(#relMark)" stroke-width="56.32"
     transform="translate(1000 300) scale(0.34) translate(-497.92 -389.12)">
    <path d="M469.76 266.24 A153.6 122.88 0 0 1 469.76 512"/>
    <path d="M469.76 512 A153.6 122.88 0 0 1 469.76 757.76"/>
    <path d="M400.64 512 H623.36"/>
