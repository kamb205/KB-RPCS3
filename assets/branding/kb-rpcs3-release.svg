<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="KB-RPCS3 Alpha 0.1.0 release artwork">
  <!-- KB-RPCS3 release artwork (1280x640). Original artwork. -->
  <defs>
    <linearGradient id="relBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1A"/>
      <stop offset="0.55" stop-color="#101B30"/>
      <stop offset="1" stop-color="#182B50"/>
    </linearGradient>
    <radialGradient id="relGlow" gradientUnits="userSpaceOnUse" cx="980" cy="200" r="620">
      <stop offset="0" stop-color="#00D6E8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#00D6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="relMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BEDF7"/>
      <stop offset="1" stop-color="#00A8CF"/>
    </linearGradient>
    <linearGradient id="relRule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00D6E8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00D6E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#relBg)"/>
  <rect width="1280" height="640" fill="url(#relGlow)"/>
  <rect x="96" y="140" width="5" height="360" rx="2.5" fill="url(#relRule)"/>

  <text x="140" y="210" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="30" letter-spacing="6" fill="#6E93A3">KB-RPCS3</text>

  <text x="140" y="360" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
