  <text x="143" y="420" font-family="Arial, Helvetica, sans-serif" font-size="40"
        fill="#9DBECE">First public source release</text>

  <rect x="142" y="462" width="470" height="60" rx="30" fill="#00D6E8" fill-opacity="0.10"
