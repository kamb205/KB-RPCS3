<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="KB-RPCS3 banner">
  <!-- KB-RPCS3 wide README banner. Original artwork. -->
  <defs>
    <linearGradient id="banBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B111C"/>
      <stop offset="0.55" stop-color="#101B30"/>
      <stop offset="1" stop-color="#16284A"/>
    </linearGradient>
    <radialGradient id="banGlow" gradientUnits="userSpaceOnUse" cx="270" cy="250" r="320">
      <stop offset="0" stop-color="#00D6E8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00D6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BEDF7"/>
      <stop offset="1" stop-color="#00A8CF"/>
    </linearGradient>
    <linearGradient id="banRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D6E8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D6E8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00D6E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#banBg)"/>
  <rect width="1600" height="500" fill="url(#banGlow)"/>
  <rect x="0" y="0" width="1600" height="4" fill="url(#banRule)"/>
  <rect x="0" y="496" width="1600" height="4" fill="url(#banRule)"/>

  <rect x="140" y="120" width="260" height="260" rx="60" fill="#0D1727" fill-opacity="0.72"
        stroke="#00BED6" stroke-opacity="0.45" stroke-width="3"/>
  <g fill="none" stroke="url(#banMark)" stroke-width="56.32"
     transform="translate(270 250) scale(0.34) translate(-497.92 -389.12)">
    <path d="M469.76 266.24 A153.6 122.88 0 0 1 469.76 512"/>
    <path d="M469.76 512 A153.6 122.88 0 0 1 469.76 757.76"/>
    <path d="M400.64 512 H623.36"/>
  </g>

  <text x="478" y="228" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="118" letter-spacing="1.5" fill="#E8F6FF">KB-RPCS3</text>
  <text x="482" y="292" font-family="Arial, Helvetica, sans-serif" font-size="40"
        fill="#9DBECE">Unofficial RPCS3 Port for PlayStation 5</text>

  <rect x="482" y="330" width="510" height="62" rx="31" fill="#00D6E8" fill-opacity="0.10"
        stroke="#00D6E8" stroke-opacity="0.55" stroke-width="2"/>
  <text x="737" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="bold" font-size="26" letter-spacing="2.5" fill="#7FE6F2">ALPHA 0.1.0 &#183; SOURCE RELEASE</text>

  <text x="482" y="446" font-family="Arial, Helvetica, sans-serif" font-size="26"
        letter-spacing="1" fill="#6E93A3">PPSA99303 &#183; Vulkan / RADV &#183; PS5 homebrew</text>
</svg>
